# Minimal single-container QRNova using SQLite (no PostgreSQL).
#
#   docker compose -f docker/docker-compose.sqlite.yml up -d   →  http://localhost

services:
  QRNova:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: ghcr.io/kspkr/QRNova:latest
    restart: unless-stopped
    environment:
      QRNova_BASE_URL: ${QRNova_BASE_URL:-http://localhost}
    volumes:
      - QRNova-data:/data
    ports:
      - "${QRNova_PORT:-80}:8080"

volumes:
  QRNova-data:
